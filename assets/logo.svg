<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Strapi Backfill DB Migrations logo">
  <title>Strapi Backfill DB Migrations</title>

  <!-- Empty schema grid (left) -->
  <g fill="none" stroke="#4945FF" stroke-width="2.5">
    <rect x="20"  y="88"  width="24" height="24" rx="3"/>
    <rect x="48"  y="88"  width="24" height="24" rx="3"/>
    <rect x="76"  y="88"  width="24" height="24" rx="3"/>
    <rect x="20"  y="116" width="24" height="24" rx="3"/>
    <rect x="48"  y="116" width="24" height="24" rx="3"/>
    <rect x="76"  y="116" width="24" height="24" rx="3"/>
    <rect x="20"  y="144" width="24" height="24" rx="3"/>
    <rect x="48"  y="144" width="24" height="24" rx="3"/>
    <rect x="76"  y="144" width="24" height="24" rx="3"/>
  </g>

  <!-- Filled / backfilled grid (right) -->
  <g fill="#4945FF">
    <rect x="156" y="88"  width="24" height="24" rx="3"/>
    <rect x="184" y="88"  width="24" height="24" rx="3"/>
    <rect x="212" y="88"  width="24" height="24" rx="3"/>
    <rect x="156" y="116" width="24" height="24" rx="3"/>
    <rect x="184" y="116" width="24" height="24" rx="3"/>
    <rect x="212" y="116" width="24" height="24" rx="3"/>
    <rect x="156" y="144" width="24" height="24" rx="3"/>
    <rect x="184" y="144" width="24" height="24" rx="3"/>
    <rect x="212" y="144" width="24" height="24" rx="3"/>
  </g>

  <!-- Backfill arrow (accent green) -->
  <g fill="none" stroke="#00C875" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="106" y1="128" x2="142" y2="128"/>
    <polyline points="134,118 150,128 134,138" fill="#00C875"/>
  </g>
</svg>
