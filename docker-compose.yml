services:
  postgres:
    image: postgres:16-alpine
    container_name: strapi-backfill-postgres
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
      POSTGRES_DB: strapi_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi_test"]
      interval: 2s
      timeout: 3s
      retries: 20
